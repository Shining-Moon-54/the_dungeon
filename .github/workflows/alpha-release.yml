name: Alpha build and release
on:
  push:
    branches: ['install-*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: the-dungeon-alpha-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate maps
        run: npm run svg
      - name: Check syntax and run tests
        run: |
          npm run lint
          npm test
      - name: Build and verify Foundry module
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./module.json').version")
          tag="v$version"
          test "$version" = "$(node -p "require('./package.json').version")"
          export RELEASE_TAG="$tag"
          node --input-type=module <<'JS'
          import {readFileSync, existsSync, mkdirSync, writeFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('module.json','utf8'));
          const base='https://github.com/'+process.env.GITHUB_REPOSITORY+'/releases/download/'+process.env.RELEASE_TAG+'/';
          const branch='install-'+m.version;
          if(m.id!=='the-dungeon' || m.manifest!=='https://raw.githubusercontent.com/'+process.env.GITHUB_REPOSITORY+'/'+branch+'/module.json' || m.download!=='https://github.com/'+process.env.GITHUB_REPOSITORY+'/archive/refs/heads/'+branch+'.zip') throw Error('Invalid source manifest');
          m.manifest=base+'module.json'; m.download=base+'the-dungeon.zip';
          mkdirSync('dist',{recursive:true});
          writeFileSync('dist/module.json',JSON.stringify(m,null,2)+'\n');
          for(const p of [...m.esmodules,...m.styles,...m.languages.map(x=>x.path)]) if(!existsSync(p)) throw Error('Missing '+p);
          JS
          test "$(find assets/prefabs -name '*.svg' | wc -l)" -ge 120
          mkdir -p dist
          mkdir -p dist/package
          cp dist/module.json LICENSE README.md ALPHA-STATUS.md dist/package/
          cp -r scripts styles lang assets dist/package/
          (cd dist/package && zip -q -r ../the-dungeon.zip .)
          rm -rf dist/package
          unzip -tq dist/the-dungeon.zip
          unzip -p dist/the-dungeon.zip module.json | cmp - dist/module.json
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-dungeon-alpha
          path: dist/
      - name: Publish versioned GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving existing assets. Bump module and package versions to publish another build."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "The Dungeon $TAG" --notes-file ALPHA-STATUS.md dist/module.json dist/the-dungeon.zip
