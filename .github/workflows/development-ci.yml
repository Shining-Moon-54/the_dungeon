name: Development CI
on:
  push:
    branches: [develop-0.6.0]
    paths: ['scripts/**','tests/**','tools/**','assets/**','styles/**','lang/**','module.json','package.json','.github/workflows/development-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run svg
      - run: npm run lint
      - run: npm test
